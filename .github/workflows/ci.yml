name: CI

# The quality gates. Every other workflow in this repository publishes or deploys and is gated on a
# tag; this one is the only thing that runs before code reaches master. It invokes the root npm
# scripts rather than reimplementing any gate inline, so a contributor can reproduce a failure
# locally with the same command. See openspec/specs/continuous-integration.

on:
  pull_request:
  push:
    branches: [master]

# Only the checkout needs anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      # Both must precede the type check and every build. core and ui each resolve through their
      # dist/, not their sources, so web type-checks against packages/{core,ui}/dist/*.d.ts. Neither
      # is produced by `npm ci`: core builds on `prepare`, which npm skips for a workspace root
      # install, and ui builds on `prepublishOnly` (a `prepare` hook would run before npm creates the
      # workspace symlinks, so ui could not resolve core and would take the whole `npm ci` down).
      #
      # Omitting the ui build here failed exactly once, on this workflow's first run, with
      # "TS2307: Cannot find module '@spekjs/ui'" — invisible locally, where a dist from an earlier
      # build is always lying around. It is the same trap that shipped the composite action broken;
      # see the "Action build chain" requirement in openspec/specs/github-action.
      - name: Build @spekjs/core and @spekjs/ui
        run: |
          npm run build:core
          npm run build:ui

      # The diagram bundle guard (packages/web/src/utils/diagramBuilds.test.ts) reads both webview
      # entry bundles, and fails rather than skips in CI when they are missing, so they are built
      # before the tests. A new step, not a new job: the job's name is a required status check.
      - name: Build webviews
        run: |
          npm run build:webview -w @spekjs/web
          npm run build:intellij -w @spekjs/web

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # build:demo follows NODE_ENV. Without production set, this exercises a React dev build —
      # a different artifact from the one that ships, which is how v1.8.0 put a dev build on the
      # live demo page.
      - name: Build demo
        run: npm run build:demo
        env:
          NODE_ENV: production

  kotlin:
    name: Kotlin gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # packages/intellij re-implements core's scanning rules in Kotlin. Nothing links the two
      # implementations, so this suite is the only thing that observes a divergence.
      - name: Test
        working-directory: packages/intellij
        run: ./gradlew test

  action-smoke:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    # Inputs for the hostile run. Each embeds commands that would leave a pwned-* canary in the
    # workspace if any shell ever parsed the value (#56); the title's use ../ because the action
    # reaches it after `cd .spek-builder`. Referenced through ${{ env.* }} in `with:` and as plain
    # variables in scripts — never interpolated into a script.
    env:
      HOSTILE_REPO_PATH: '-repo "q" $(touch pwned-repo) `touch pwned-repo-bt` it''s'
      HOSTILE_OUTPUT_PATH: '-out "d" $(touch pwned-out)/it''s `touch pwned-out-bt`.html'
      HOSTILE_TITLE: 'He said "hi" $(touch ../pwned-title) `touch ../pwned-title-bt` & <b>R&amp;D</b>'
    steps:
      - uses: actions/checkout@v7

      # spek-version MUST be the commit under test. The action checks out spekhq/spek at that ref
      # into .spek-builder and builds from *that* copy — left at its default of "master", this job
      # would run the pull request's workflow against master's action implementation and report
      # green on a change that breaks the action, which is the exact failure it exists to catch.
      - name: Run the action against this repository
        id: spek
        uses: ./
        with:
          spek-version: ${{ github.sha }}
          generate-badges: "true"

      # Assert on file contents, not on the outputs having values. A step output is set whether or
      # not the build produced anything: when @spekjs/ui's build moved off the install-time hook,
      # the action stopped producing ui's dist and shipped broken for a full day with every output
      # still populated.
      - name: Assert the action produced real output
        # Outputs arrive through env, not interpolation: the hostile run below produces paths
        # containing quotes, and an interpolated one would break this script rather than the action.
        env:
          HTML: ${{ steps.spek.outputs.html-path }}
          BADGES: ${{ steps.spek.outputs.badges-path }}
        run: |
          if [ -z "$HTML" ]; then echo "::error::html-path output is empty"; exit 1; fi
          if [ ! -s "$HTML" ]; then echo "::error::no file at html-path: $HTML"; exit 1; fi
          echo "html-path: $HTML ($(wc -c <"$HTML") bytes)"

          if [ -z "$BADGES" ]; then echo "::error::badges-path output is empty"; exit 1; fi
          if [ ! -d "$BADGES" ]; then echo "::error::no directory at badges-path: $BADGES"; exit 1; fi
          count=$(find "$BADGES" -name '*.svg' -size +0c | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no non-empty badge in $BADGES"; exit 1; fi
          echo "badges-path: $BADGES ($count badges)"

      # Inputs must reach the action's shell steps as data (#56). A symlink to this repository
      # stands in for a hostile repo-path, so the run still scans real content.
      - name: Create a hostile repo-path
        run: ln -s -- . "$HOSTILE_REPO_PATH"

      - name: Run the action with shell-hostile inputs
        id: hostile
        uses: ./
        with:
          spek-version: ${{ github.sha }}
          repo-path: ${{ env.HOSTILE_REPO_PATH }}
          output-path: ${{ env.HOSTILE_OUTPUT_PATH }}
          title: ${{ env.HOSTILE_TITLE }}
          generate-badges: "true"

      - name: Assert hostile inputs arrived literally and ran nothing
        env:
          HTML: ${{ steps.hostile.outputs.html-path }}
          BADGES: ${{ steps.hostile.outputs.badges-path }}
        run: |
          set -euo pipefail

          expected_html=$(realpath -- "$HOSTILE_OUTPUT_PATH")
          if [ "$HTML" != "$expected_html" ]; then
            echo "::error::html-path is [$HTML], expected [$expected_html]"; exit 1
          fi
          if [ ! -s "$HTML" ]; then echo "::error::no file at html-path: [$HTML]"; exit 1; fi
          echo "html-path is the literal output-path: [$HTML]"

          # The build escapes &, < and > in the title; html.escape(quote=False) escapes exactly those.
          expected_title=$(python3 -c 'import html, os; print("<title>" + html.escape(os.environ["HOSTILE_TITLE"], quote=False) + "</title>")')
          if ! grep -qF -- "$expected_title" "$HTML"; then
            echo "::error::the title did not arrive literally; the page has:"
            grep -o '<title>.*</title>' "$HTML" | head -1
            exit 1
          fi
          echo "title arrived literally: $expected_title"

          count=$(find "$BADGES" -name '*.svg' -size +0c | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no non-empty badge in [$BADGES]"; exit 1; fi
          echo "badges-path: [$BADGES] ($count badges)"

          canaries=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name 'pwned-*')
          if [ -n "$canaries" ]; then echo "::error::a command inside an input was executed: $canaries"; exit 1; fi
          echo "no canary: no command inside any input ran"

      # Last, because a failed composite action skips its own cleanup. Unchecked, this value writes
      # a second html-path line to $GITHUB_OUTPUT and the later line wins — a forged output.
      - name: Run the action with an output-path that would forge an output
        id: forged
        continue-on-error: true
        uses: ./
        with:
          spek-version: ${{ github.sha }}
          output-path: "forged-out/x\nhtml-path=/forged.html"

      - name: Assert the forging run failed and forged nothing
        env:
          OUTCOME: ${{ steps.forged.outcome }}
          FORGED_HTML: ${{ steps.forged.outputs.html-path }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the forging run to fail; outcome was $OUTCOME, html-path [$FORGED_HTML]"; exit 1
          fi
          if [ "$FORGED_HTML" = "/forged.html" ]; then echo "::error::html-path was forged"; exit 1; fi
          echo "forging run failed as required (html-path: [$FORGED_HTML])"
